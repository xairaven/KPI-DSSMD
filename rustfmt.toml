# Stable options only (the pinned toolchain is stable). Only non-default values are listed.
edition = "2024"
style_edition = "2024"
newline_style = "Unix"

# Width
max_width = 90
chain_width = 60

# Layout
fn_params_layout = "Compressed"
match_block_trailing_comma = true

# Shorthands
use_field_init_shorthand = true
use_try_shorthand = true