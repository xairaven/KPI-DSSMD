[package]
name = "lab7"
version = "0.0.1"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"

categories = ["science"]
readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/KPI-DSSMD"

publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lab7_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }

# Added via a git dependency (tag), not crates.io — demonstrates a second
# method of pulling in a third-party library, for comparison in the report.
qrcode = { git = "https://github.com/kennytm/qrcode-rust", tag = "v0.14.1", default-features = false, features = [
    "svg",
] }

# SQLite storage (Lab 6) — replaces the JSON file from previous labs.
# `bundled` compiles SQLite from source so it cross-compiles for Android too.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tauri-plugin-fs = "2.7.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

collapsible_if = "warn"
collapsible_else_if = "warn"
collapsible_match = "warn"
collapsible_str_replace = "warn"
indexing_slicing = "deny"

allow_attributes_without_reason = "warn"
inconsistent_struct_constructor = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[lints.rust]
unsafe_code = "deny"

unused_doc_comments = "allow"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2.5.0"
